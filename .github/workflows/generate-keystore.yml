# Запускается ОДИН раз, вручную: Actions → Generate Keystore → Run workflow.
# Пароль берётся из секрета KEYSTORE_PASSWORD, а не пишется в файл:
# репозиторий публичный, и всё, что лежит в коде, видят все.
# Ключ без пароля бесполезен, но после копирования base64 удали этот запуск (Delete workflow run).
name: Generate Keystore
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate keystore
        env:
          PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ${#PASS} -lt 12 ]; then echo "Сначала создай секрет KEYSTORE_PASSWORD длиной от 12 символов"; exit 1; fi
          keytool -genkey -v \
            -keystore tail-risk.jks \
            -alias tail-risk \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LOSIEV YURII, OU=LOSIEV YURII, O=LOSIEV YURII, L=Tbilisi, S=Tbilisi, C=GE" \
            -storepass "$PASS" -keypass "$PASS"
      - name: Print base64 (скопируй всё между строками в секрет KEYSTORE_BASE64)
        run: |
          echo "----- НАЧАЛО -----"
          base64 -w 0 tail-risk.jks; echo
          echo "----- КОНЕЦ -----"
